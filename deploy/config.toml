# Example production config for yakvc-server: rendezvous plus the embedded
# relay, with a Let's Encrypt certificate. Replace relay.example.com and the
# contact address. See deploy/README.md.

# Key files, created on first start next to the certificate cache. Back them
# up: clients are configured with the ids they produce.
endpoint_key = "/var/lib/yakvc/endpoint.key"
issuer_key = "/var/lib/yakvc/issuer.key"

# The rendezvous endpoint (UDP).
bind = "0.0.0.0:7843"

# Scrape from the same host only: the endpoint has no authentication.
metrics_bind = "127.0.0.1:9100"

[relay]
# Plain HTTP; also answers Let's Encrypt.
http_bind = "0.0.0.0:80"
https_bind = "0.0.0.0:443"
# QUIC address discovery (UDP), which tells clients their public address.
quic_bind = "0.0.0.0:7842"
domain = "relay.example.com"
acme_contact = "admin@example.com"
acme_cache_dir = "/var/lib/yakvc/acme"
# Never set `open = true` on a public server: it relays for anyone.
