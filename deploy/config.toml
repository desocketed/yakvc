# Production config for yakvc-server: rendezvous plus the embedded relay at
# relay01.purplg.com, with a Let's Encrypt certificate. Set the contact
# address before the first start. Self-hosters replace the domain too; see
# deploy/README.md.

# Key files, created on first start next to the certificate cache. Back them
# up: clients are configured with the ids they produce.
endpoint_key = "/var/lib/yakvc/endpoint.key"
issuer_key = "/var/lib/yakvc/issuer.key"

# The rendezvous endpoint (UDP). Every `[::]` bind serves IPv4 and IPv6.
bind = "[::]:7843"

# Scrape from the same host only: the endpoint has no authentication.
metrics_bind = "127.0.0.1:9100"

# Relays run apart from this server that clients may advertise to each
# other. Every other relay URL is dropped from players' addresses, so that a
# peer can't make another dial a relay of its choosing.
# extra_relays = ["https://relay02.example.com"]

[relay]
# Plain HTTP; also answers Let's Encrypt.
http_bind = "[::]:80"
https_bind = "[::]:443"
# QUIC address discovery (UDP), which tells clients their public address.
quic_bind = "[::]:7842"
domain = "relay01.purplg.com"
acme_contact = "admin@example.com"
acme_cache_dir = "/var/lib/yakvc/acme"
# Never set `open = true` on a public server: it relays for anyone.
