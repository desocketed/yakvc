# yakvc-server with Docker Compose. Put config.toml, endpoint.key and
# issuer.key in ./config first (see README.md), then `docker compose up -d`.
services:
  yakvc-server:
    # Pin a release (for example :0.1.0) to upgrade deliberately.
    image: ghcr.io/desocketed/yakvc-server:latest
    restart: unless-stopped
    ports:
      - "80:80/tcp" # relay HTTP and Let's Encrypt
      - "443:443/tcp" # relay HTTPS
      - "7842:7842/udp" # QUIC address discovery
      - "7843:7843/udp" # rendezvous
    volumes:
      - ./config:/etc/yakvc:ro
      - state:/var/lib/yakvc

volumes:
  # The Let's Encrypt account and certificate, kept across restarts so a
  # restart doesn't ask for a new certificate.
  state:
