[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
yakvc-shared = { path = "crates/yakvc-shared" }
yakvc-audio = { path = "crates/yakvc-audio" }
yakvc-client = { path = "crates/yakvc-client" }
yakvc-server = { path = "crates/yakvc-server" }
yakvc-testkit = { path = "crates/yakvc-testkit" }

# Third party
anyhow = "1.0.104"
bytes = "1.12.1"
cbindgen = { version = "0.29.4", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
hound = "3.5.1"
# Defaults minus portmapper (UPnP, which the server has no use for; it also
# pulls in MPL-2.0 attohttpc). The client can opt in with `features`.
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "1.3.0", default-features = false, features = ["key"] }
iroh-relay = { version = "1.3.0", features = ["server"] }
nnnoiseless = { version = "0.5.2", default-features = false }
opus = "0.4.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.10.3"
# iroh picks ring as the TLS crypto provider; reqwest and rustls follow it.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rtrb = "0.4.0"
rubato = "5.0.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = "1.53.2"
toml = "1.1.6"
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"

# The natives shipped in the mod jar (`cargo xtask natives`/`dist`). One jar
# carries every platform's library, so size matters: optimize for size, but
# keep the per-frame audio crates at full speed. panic stays "unwind" because
# the FFI guard catches panics at the C boundary.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.dist.package]
yakvc-audio.opt-level = 3
nnnoiseless.opt-level = 3
opus.opt-level = 3
opusic-sys.opt-level = 3
rubato.opt-level = 3
realfft.opt-level = 3
rustfft.opt-level = 3
