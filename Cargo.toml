[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
yakvc-shared = { path = "crates/yakvc-shared" }
yakvc-audio = { path = "crates/yakvc-audio" }
yakvc-client = { path = "crates/yakvc-client" }
yakvc-server = { path = "crates/yakvc-server" }
yakvc-testkit = { path = "crates/yakvc-testkit" }

# Third party
anyhow = "1.0.104"
bytes = "1.12.1"
cbindgen = { version = "0.29.4", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
iroh-base = { version = "1.3.0", default-features = false, features = ["key"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = "1.53.2"
toml = "1.1.6"
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
