[package]
name = "yakvc-client"
description = "Yak VC voice engine used by the Fabric mod and the CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Network impairment for tests and load testing.
sim = []

[dependencies]
bytes.workspace = true
# The port mapper (UPnP, NAT-PMP, PCP) helps hole-punching behind home
# routers. The net report is for `yakvc net report`.
iroh = { workspace = true, features = ["portmapper", "unstable-net-report"] }
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
toml.workspace = true
tracing.workspace = true
yakvc-audio.workspace = true
yakvc-proto.workspace = true

[dev-dependencies]
iroh-relay.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true
