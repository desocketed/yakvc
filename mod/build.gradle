plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'yakvc'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional: only the API is compiled against; the mod loads without Mod Menu.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// The client gametest clicks through the real Mod Menu; dev runs only, never in the jar or its dependencies.
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Native library staging. By default `cargo xtask natives` builds yakvc-ffi
// for the host; `-Pyakvc.prebuiltNatives=<dir>` uses an already staged
// directory instead (CI packaging) and skips cargo.
def prebuiltNatives = providers.gradleProperty('yakvc.prebuiltNatives')
def hostNativesDir = layout.buildDirectory.dir('natives')

def cargoNatives = tasks.register('cargoNatives', Exec) {
	description = 'Builds yakvc-ffi for the host with `cargo xtask natives`.'
	workingDir = rootDir.parentFile
	def out = hostNativesDir.get().asFile
	commandLine 'cargo', 'xtask', 'natives', '--target', 'host', '--out', out.absolutePath
	outputs.dir(out)
	// Cargo does its own up-to-date checking.
	outputs.upToDateWhen { false }
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}

	if (prebuiltNatives.isPresent()) {
		from(prebuiltNatives.map { file(it) }) { into 'natives' }
	} else {
		from(cargoNatives) { into 'natives' }
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "yakvc-gametest"
		// Client-only mod: no server game tests, so no EULA acceptance is needed.
		enableGameTests = false
		enableClientGameTests = true
	}
}

loom {
	runs {
		configureEach {
			vmArg '--enable-native-access=ALL-UNNAMED'
		}
	}
}

test {
	useJUnitPlatform()
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// `cargo xtask dist` passes the notices of the Rust dependencies linked into the natives.
def thirdPartyLicenses = providers.gradleProperty('yakvc.thirdPartyLicenses')

jar {
	from(rootProject.file('../LICENSE-MIT'))
	from(rootProject.file('../LICENSE-APACHE'))
	if (thirdPartyLicenses.isPresent()) {
		from(thirdPartyLicenses.map { file(it) })
	}
	// JEP 472: lets FFM load the natives without a warning where the jar is the launched application. Minecraft
	// launchers don't launch mod jars, so players still need --enable-native-access=ALL-UNNAMED (see README).
	manifest {
		attributes 'Enable-Native-Access': 'ALL-UNNAMED'
	}
}

// The gametest starts a dev yakvc-server and writes the client config for it (DevRendezvous in the gametest
// sources). Cargo builds the server, unless `-Pyakvc.prebuiltServer=<binary>` gives one (CI).
def prebuiltServer = providers.gradleProperty('yakvc.prebuiltServer')
def cargoServer = tasks.register('cargoServer', Exec) {
	description = 'Builds yakvc-server for the client gametest.'
	workingDir = rootDir.parentFile
	commandLine 'cargo', 'build', '--quiet', '-p', 'yakvc-server'
	// Cargo does its own up-to-date checking.
	outputs.upToDateWhen { false }
}
// The screenshots are all for the user guide (scripts/UpdateGuideScreenshots.java), so none may be left from an
// earlier run.
def screenshotsDir = layout.buildDirectory.dir('run/clientGameTest/screenshots').get().asFile
tasks.named('runClientGameTest') {
	if (!prebuiltServer.isPresent()) dependsOn cargoServer
	def server = prebuiltServer.getOrElse(new File(rootDir.parentFile, 'target/debug/yakvc-server').absolutePath)
	systemProperty 'yakvc.gametest.server', file(server).absolutePath
	doFirst {
		screenshotsDir.deleteDir()
		// Mod Menu's update checker would go online and could add badges to the screenshot.
		def modMenuConfig = new File(screenshotsDir.parentFile, 'config/modmenu.json')
		modMenuConfig.parentFile.mkdirs()
		modMenuConfig.text = '{"update_checker": false, "button_update_badge": false}\n'
	}
}

// scripts/two-clients.sh runs a server and two clients at once, which one Gradle build can't. This writes the java
// command line of runClient and runServer, one argument per line, so the script can start them directly.
tasks.register('writeDevLaunchArgs') {
	dependsOn 'classes', 'configureLaunch', 'configureClientLaunch'
	notCompatibleWithConfigurationCache('reads the Loom run tasks')
	def outDir = layout.buildDirectory.dir('devlaunch')
	doLast {
		[client: tasks.runClient, server: tasks.runServer].each { name, run ->
			// Loom passes the classpath in an @file it writes when the run starts, so pass it directly instead.
			def jvmArgs = run.allJvmArgs.findAll { !it.startsWith('@') }
			def args = jvmArgs + ['-cp', run.classpath.asPath, run.mainClass.get()] + run.args
			def file = outDir.get().file("${name}.args").asFile
			file.parentFile.mkdirs()
			file.text = args.join('\n') + '\n'
		}
	}
}
