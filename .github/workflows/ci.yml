name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask header --check
      - run: cargo test --workspace
      - name: Server has no audio dependencies
        run: |
          if cargo tree -p yakvc-server -e normal --prefix none \
              | grep -E '^(yakvc-audio|yakvc-client|cpal|opus|audiopus|alsa)'; then
            echo "yakvc-server must not depend on audio crates" >&2
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build mod with host natives
        working-directory: mod
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: yakvc-mod
          path: mod/build/libs/*.jar
      - name: Install headless graphics
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
      # Loom runs client gametests under Xvfb when CI is set.
      - name: Client gametest
        working-directory: mod
        run: ./gradlew runClientGameTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-screenshots
          path: mod/build/run/clientGameTest/screenshots/
