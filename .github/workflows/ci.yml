name: CI

# The repository is public, so standard runners cost nothing: every push to
# main and every pull request runs everything on Linux, Windows and macOS.
# A version tag also publishes the release.
on:
  push:
    branches: [main]
    # A version tag (v<workspace version>) also publishes the release.
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  # Pull requests always run, so the required `ci-ok` check reports even
  # when `changes` finds only docs and the build is skipped.
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_relay:
        description: Deploy the relay
        type: boolean
        default: false

# Actions from outside GitHub's own `actions/` are pinned to a commit, since
# a tag can be moved to other code; the comment names the release it was.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to a pull request cancels its running checks. Pushes to main
# and tag runs finish, since a cancelled tag run would publish half a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request touches more than docs (the same files a push to
  # main ignores). Pushes and manual runs always build, except a push to
  # main of a commit that already carries a version tag: the tag's own run
  # builds and releases it, so the tag is pushed first and main right after.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && git tag --points-at HEAD | grep -q "^v"; then
            echo "tagged $(git tag --points-at HEAD | tr "\n" " "): the tag run builds this commit"
            echo code=false >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE" ] || git diff --name-only "$BASE" HEAD | grep -qvE '(\.md$|^docs/|^LICENSE-)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # cpal links ALSA; libopus is built from source with cmake (preinstalled).
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The client crates as they ship: yakvc-testkit turns on the sim feature
      # in any build that includes it.
      - run: cargo clippy -p yakvc-client -p yakvc-ffi -p yakvc-cli --all-targets --locked -- -D warnings
      - run: cargo xtask header --check
      - run: cargo test --workspace --all-features --locked
      - name: Server has no audio dependencies
        run: cargo xtask check-server-deps

  # yakvc-ffi for every platform, plus yakvc-cli for the release. Linux has
  # a job of its own, so a pull request's jar and gametest wait for it alone;
  # Windows and the two Macs build in parallel beside it, and the `jar` job
  # merges everything into the release jar.
  natives-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-zigbuild
      # The aarch64 build links ARM's libasound, from Ubuntu's ports archive
      # through multiarch. The runner's own sources serve amd64 only.
      - name: Install ALSA for x86_64 and aarch64
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: $codename $codename-updates $codename-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libasound2-dev:arm64
          echo "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
      - run: cargo xtask natives --target all --out natives
      - uses: actions/upload-artifact@v7
        with:
          name: natives-Linux
          path: natives/
      # The runner's libasound.so needs a newer glibc than 2.17. Skip checking
      # it: at run time the user's libasound matches their glibc.
      - name: Build yakvc-cli
        run: |
          mkdir cli
          RUSTFLAGS="-C link-arg=-Wl,--allow-shlib-undefined" \
            cargo zigbuild --release --locked -p yakvc-cli --target x86_64-unknown-linux-gnu.2.17
          cp target/x86_64-unknown-linux-gnu/release/yakvc-cli cli/yakvc-cli-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: cli-Linux
          path: cli/

  # Each Mac architecture on its own runner, in parallel: one after the
  # other they were the slowest job. The `jar` job merges them.
  natives:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `test` runs the engine and JUnit tests where the runner can run
          # the target: macos-latest is arm, so not on the x86_64 half.
          - { os: windows-latest, target: all, name: Windows, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, test: false }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, test: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - run: cargo xtask natives --target ${{ matrix.target }} --out natives
      - uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.name }}
          path: natives/
      - name: Engine tests
        if: matrix.test
        run: cargo test --locked -p yakvc-client -p yakvc-ffi -p yakvc-audio
      - uses: actions/setup-java@v6
        if: matrix.test
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.test
      - name: Mod tests
        if: matrix.test
        working-directory: mod
        shell: bash
        run: ./gradlew test -Pyakvc.prebuiltNatives="$GITHUB_WORKSPACE/natives"
      - name: Build yakvc-cli
        shell: bash
        run: |
          mkdir cli
          if [ "$RUNNER_OS" = Windows ]; then
            cargo build --release --locked -p yakvc-cli --target x86_64-pc-windows-msvc
            cp target/x86_64-pc-windows-msvc/release/yakvc-cli.exe cli/yakvc-cli-windows-x86_64.exe
          else
            cargo build --release --locked -p yakvc-cli --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/yakvc-cli cli/yakvc-cli-${{ matrix.name }}
          fi
      # A Mac's half of the CLI isn't a release file: `jar` merges the two.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os == 'Windows' && 'cli-Windows' || format('maccli-{0}', matrix.name) }}
          path: cli/

  # The jar with this machine's natives and the gametest, on every run. It
  # waits for Linux alone; the release jar with every platform is `jar`'s.
  mod:
    # The server job's yakvc-server is the gametest's dev rendezvous.
    needs: [natives-linux, server]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # ALSA for the natives at runtime; Xvfb and Mesa's software Vulkan for the gametest.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb mesa-vulkan-drivers libvulkan1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@v8
        with:
          name: natives-Linux
          path: natives
      - name: Build the jar
        run: cargo xtask dist --from natives
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server
      # Loom runs client gametests under Xvfb when CI is set. Uses the jar's
      # natives rather than a fresh host build.
      - name: Client gametest
        working-directory: mod
        run: |
          chmod +x "$GITHUB_WORKSPACE/server/yakvc-server-linux-x86_64"
          ./gradlew runClientGameTest -Pyakvc.prebuiltNatives="$GITHUB_WORKSPACE/target/dist/natives" \
            -Pyakvc.prebuiltServer="$GITHUB_WORKSPACE/server/yakvc-server-linux-x86_64"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-screenshots
          path: mod/build/run/clientGameTest/screenshots/

  # The release jar with every platform's natives, the launcher packs and
  # the Mac CLI, merged from both architectures. Not for pull requests,
  # whose `mod` job builds and tests a Linux-only jar without waiting for
  # the other platforms.
  jar:
    needs: [natives-linux, natives]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # ALSA for the JUnit tests' native load; LLVM for llvm-lipo.
      - name: Install system libraries
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev llvm
          # Ubuntu names LLVM's tools by version only on PATH (llvm-lipo-18);
          # the plain names live in its versioned directory.
          dirname "$(ls /usr/lib/llvm-*/bin/llvm-lipo | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@v8
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true
      - run: cargo xtask merge-macos natives
      - name: Build the jar
        run: cargo xtask dist --from natives
      - name: Build the launcher packs
        run: cargo xtask pack
      - name: Check the jar
        run: cargo xtask check-jar dist/yakvc-*.jar
      - uses: actions/upload-artifact@v7
        with:
          name: yakvc-mod
          path: |
            dist/*.jar
            dist/*.mrpack
            dist/*-prism.zip
      - uses: actions/download-artifact@v8
        with:
          pattern: maccli-*
          path: maccli
          merge-multiple: true
      - name: Merge the Mac CLI
        run: |
          mkdir cli
          llvm-lipo -create maccli/yakvc-cli-macos-x86_64 maccli/yakvc-cli-macos-aarch64 \
            -output cli/yakvc-cli-macos-universal
      - uses: actions/upload-artifact@v7
        with:
          name: cli-macOS
          path: cli/

  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-zigbuild,cargo-about
      - run: cargo xtask server-image
      # Started as deploy/yakvc-server-docker.service starts it, the first run
      # must create its keys in a fresh volume (#51) and a second run must
      # find the same ones there.
      - name: Smoke-test the image's first start
        run: cargo xtask server-smoke
      - name: Save the image and binary
        run: |
          mkdir server
          docker save yakvc-server:latest | gzip > server/yakvc-server-image.tar.gz
          cp target/server-image/yakvc-server server/yakvc-server-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: server/

  # The flake's server package (with its tests) and NixOS module. Runners
  # build in Nix's sandbox, unlike the dev container.
  nix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check --print-build-logs
      # cargo-deny comes from the dev shell, so CI and `scripts/ci-local.sh`
      # run the same build of it.
      - run: nix develop --command cargo deny --all-features --locked check

  # The one check branch protection requires: green when every job passed,
  # or was skipped (a pull request that only touches docs, or `jar` on a
  # pull request).
  ci-ok:
    if: always()
    needs: [changes, rust, natives-linux, natives, mod, jar, server, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done

  # On a version tag: the GitHub release (jar, launcher packs, yakvc-cli,
  # static yakvc-server, SHA256SUMS) and the image on GHCR. Nothing goes to
  # Modrinth or CurseForge (maintainer, 2026-10-11): releases live on GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, mod, jar, server, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yakvc-mod
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server
      - name: Check the tag matches the version
        run: |
          version=${GITHUB_REF_NAME#v}
          test -f "dist/yakvc-$version.jar" || { echo "tag $GITHUB_REF_NAME, but built $(ls dist)" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Alphas are playtest builds: a GitHub prerelease with no server
          # image.
          if [[ $version == *-alpha* ]]; then echo "GITHUB_ONLY=true" >> "$GITHUB_ENV"; fi
      - name: GitHub release
        run: |
          # A version like 0.2.0-beta.1 makes a prerelease.
          flags=(--generate-notes)
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease); fi
          cp "dist/yakvc-$VERSION.jar" "dist/yakvc-$VERSION.mrpack" "dist/yakvc-$VERSION-prism.zip" \
            server/yakvc-server-linux-x86_64 release/
          # Checksums let a download by version (the NixOS server's, for one)
          # pin and check the file's hash.
          (cd release && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/*
      - name: Server image to GHCR
        if: env.GITHUB_ONLY != 'true'
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/yakvc-server
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load < server/yakvc-server-image.tar.gz
          # Only a full release moves `latest`: a beta must not become what
          # an unpinned `docker pull` gets.
          tags=("$VERSION")
          if [[ $VERSION != *-* ]]; then tags+=(latest); fi
          for tag in "${tags[@]}"; do
            docker tag yakvc-server:latest "$image:$tag"
            docker push "$image:$tag"
          done

  # Puts the release on the production relay with `cargo xtask deploy-relay`
  # (see xtask/src/relay.rs). A manual run with "Deploy the relay" ticked
  # does the same for any commit that passed CI. The secrets are the
  # command's flags: RELAY_DEPLOY_KEY (an SSH key that reads the host flake
  # and logs in to the box), RELAY_FLAKE, RELAY_TARGET and RELAY_KNOWN_HOSTS.
  deploy:
    if: >-
      !cancelled() && needs.ci-ok.result == 'success'
      && ((github.ref_type == 'tag' && needs.release.result == 'success')
          || inputs.deploy_relay == true)
    needs: [ci-ok, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Deploy
        env:
          RELAY_DEPLOY_KEY: ${{ secrets.RELAY_DEPLOY_KEY }}
          RELAY_KNOWN_HOSTS: ${{ secrets.RELAY_KNOWN_HOSTS }}
          RELAY_FLAKE: ${{ secrets.RELAY_FLAKE }}
          RELAY_TARGET: ${{ secrets.RELAY_TARGET }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$RELAY_DEPLOY_KEY" > key
          printf '%s\n' "$RELAY_KNOWN_HOSTS" > known_hosts
          cargo xtask deploy-relay --flake "$RELAY_FLAKE" --target "$RELAY_TARGET" \
            --key key --known-hosts known_hosts --rev "$GITHUB_SHA"
