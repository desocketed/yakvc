name: CI

# The repository is public, so standard runners cost nothing: every push to
# main and every pull request runs everything on Linux, Windows and macOS.
# A version tag also publishes the release.
on:
  push:
    branches: [main]
    # A version tag (v<workspace version>) also publishes the release.
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cpal links ALSA; libopus is built from source with cmake (preinstalled).
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo xtask header --check
      - run: cargo test --workspace --all-features
      - name: Server has no audio dependencies
        run: |
          if cargo tree -p yakvc-server -e normal --prefix none \
              | grep -E '^(yakvc-audio|yakvc-client|cpal|opus|audiopus|alsa)'; then
            echo "yakvc-server must not depend on audio crates" >&2
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # yakvc-ffi for every platform, plus yakvc-cli for the release. Each OS
  # builds its own targets; the mod job merges them into one jar.
  natives:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # The aarch64 build links ARM's libasound, from Ubuntu's ports archive
      # through multiarch. The runner's own sources serve amd64 only.
      - name: Install ALSA for x86_64 and aarch64
        if: runner.os == 'Linux'
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: $codename $codename-updates $codename-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libasound2-dev:arm64
          echo "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
      - run: cargo xtask natives --target all --out natives
      - uses: actions/upload-artifact@v7
        with:
          name: natives-${{ runner.os }}
          path: natives/
      - name: Build yakvc-cli
        shell: bash
        run: |
          mkdir cli
          case "$RUNNER_OS" in
            Linux)
              # The runner's libasound.so needs a newer glibc than 2.17. Skip
              # checking it: at run time the user's libasound matches their glibc.
              RUSTFLAGS="-C link-arg=-Wl,--allow-shlib-undefined" \
                cargo zigbuild --release -p yakvc-cli --target x86_64-unknown-linux-gnu.2.17
              cp target/x86_64-unknown-linux-gnu/release/yakvc-cli cli/yakvc-cli-linux-x86_64
              ;;
            macOS)
              cargo build --release -p yakvc-cli --target x86_64-apple-darwin
              cargo build --release -p yakvc-cli --target aarch64-apple-darwin
              lipo -create target/x86_64-apple-darwin/release/yakvc-cli \
                target/aarch64-apple-darwin/release/yakvc-cli -output cli/yakvc-cli-macos-universal
              ;;
            Windows)
              cargo build --release -p yakvc-cli --target x86_64-pc-windows-msvc
              cp target/x86_64-pc-windows-msvc/release/yakvc-cli.exe cli/yakvc-cli-windows-x86_64.exe
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ runner.os }}
          path: cli/

  mod:
    # The server job's yakvc-server is the gametest's dev rendezvous.
    needs: [natives, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ALSA for the natives at runtime; Xvfb and Mesa's software Vulkan for the gametest.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb mesa-vulkan-drivers libvulkan1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true
      - name: Build the jar
        run: cargo xtask dist --from natives
      - name: Check the jar
        run: |
          jar=$(ls dist/yakvc-*.jar)
          unzip -l "$jar" | tee contents
          entries="natives/natives.sha256 natives/linux-x86_64/libyakvc_ffi.so
            natives/linux-aarch64/libyakvc_ffi.so natives/windows-x86_64/yakvc_ffi.dll
            natives/macos-universal/libyakvc_ffi.dylib THIRD_PARTY_LICENSES"
          for entry in $entries; do
            grep -q " $entry\$" contents || { echo "$jar has no $entry" >&2; exit 1; }
          done
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q '^Enable-Native-Access: ALL-UNNAMED'
      - uses: actions/upload-artifact@v7
        with:
          name: yakvc-mod
          path: dist/*.jar
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server
      # Loom runs client gametests under Xvfb when CI is set. Uses the jar's
      # natives rather than a fresh host build.
      - name: Client gametest
        working-directory: mod
        run: |
          chmod +x "$GITHUB_WORKSPACE/server/yakvc-server-linux-x86_64"
          ./gradlew runClientGameTest -Pyakvc.prebuiltNatives="$GITHUB_WORKSPACE/target/dist/natives" \
            -Pyakvc.prebuiltServer="$GITHUB_WORKSPACE/server/yakvc-server-linux-x86_64"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-screenshots
          path: mod/build/run/clientGameTest/screenshots/

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-about
      - run: cargo xtask server-image
      - name: Smoke-test the image
        run: docker run --rm yakvc-server --version
      - name: Save the image and binary
        run: |
          mkdir server
          docker save yakvc-server:latest | gzip > server/yakvc-server-image.tar.gz
          cp target/server-image/yakvc-server server/yakvc-server-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: server/

  # The flake's server package (with its tests) and NixOS module. Runners
  # build in Nix's sandbox, unlike the dev container.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs

  # On a version tag: the GitHub release (jar, yakvc-cli, static
  # yakvc-server), the image on GHCR, and the jar on Modrinth and
  # CurseForge. Each mod site is skipped until its secret and project
  # variable exist.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, deny, mod, server, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yakvc-mod
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server
      - name: Check the tag matches the version
        run: |
          version=${GITHUB_REF_NAME#v}
          test -f "dist/yakvc-$version.jar" || { echo "tag $GITHUB_REF_NAME, but built $(ls dist)" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: GitHub release
        run: |
          # A version like 0.2.0-beta.1 makes a prerelease.
          flags=(--generate-notes)
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            "dist/yakvc-$VERSION.jar" release/* server/yakvc-server-linux-x86_64
      - name: Server image to GHCR
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/yakvc-server
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load < server/yakvc-server-image.tar.gz
          for tag in "$VERSION" latest; do
            docker tag yakvc-server:latest "$image:$tag"
            docker push "$image:$tag"
          done
      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: dist/yakvc-${{ env.VERSION }}.jar
          name: Yak VC ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          loaders: fabric
          game-versions: "26.3"
          java: "25"
          dependencies: fabric-api(required)
      - name: CurseForge
        if: env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: dist/yakvc-${{ env.VERSION }}.jar
          name: Yak VC ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          loaders: fabric
          game-versions: "26.3"
          java: "25"
          dependencies: fabric-api(required)
