[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Everything we ship is MIT OR Apache-2.0; dependencies must be compatible.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list anticipates deps added in later milestones.
unused-allowed-license = "allow"
exceptions = [
    # Build tool used only by xtask; never linked into anything we ship.
    { crate = "cbindgen", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
